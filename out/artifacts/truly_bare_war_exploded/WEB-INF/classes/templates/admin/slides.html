<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/layout :: head('Homepage Banners')}"></head>
<body>

<div th:replace="~{admin/layout :: sidebar('slides')}"></div>

<div class="main-content">
    <div class="topbar">
        <span class="page-title">🖼 Homepage Banners</span>
        <a th:href="@{/admin/slides/new}" class="btn btn-primary">➕ Add New Banner</a>
    </div>

    <div class="content-area">
        <div class="flash-success" th:if="${success}">✅ <span th:text="${success}"></span></div>
        <div class="flash-error"   th:if="${error}">  ❌ <span th:text="${error}"></span></div>

        <div th:if="${slides.isEmpty()}"
             style="text-align:center; padding:60px 20px; color:var(--text-muted);">
            <div style="font-size:48px; margin-bottom:16px;">🖼</div>
            <p style="font-size:16px; font-weight:500; margin-bottom:8px;">No banners yet</p>
            <p style="font-size:14px; margin-bottom:24px;">Add your first homepage banner to promote products or offers.</p>
            <a th:href="@{/admin/slides/new}" class="btn btn-primary">➕ Add First Banner</a>
        </div>

        <!-- Slide Cards Grid -->
        <div th:if="${!slides.isEmpty()}"
             style="display:grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap:20px;">
            <div th:each="s : ${slides}" class="card">

                <!-- Preview Image -->
                <div th:if="${s.imageUrl != null and !s.imageUrl.isBlank()}"
                     style="height:160px; overflow:hidden; border-radius:14px 14px 0 0; background:rgba(250,248,245,0.8);">
                    <img th:src="${s.imageUrl}" alt="Slide Preview"
                         style="width:100%; height:100%; object-fit:cover; display:block;"
                         onerror="this.style.display='none'; this.parentElement.innerHTML='<div style=\'display:flex;align-items:center;justify-content:center;height:100%;color:var(--text-muted);font-size:13px;\'>Image not found</div>'"/>
                </div>
                <div th:unless="${s.imageUrl != null and !s.imageUrl.isBlank()}"
                     style="height:160px; background:rgba(250,248,245,0.8); border-radius:14px 14px 0 0; display:flex; align-items:center; justify-content:center; color:var(--text-muted); font-size:13px;">
                    No image set
                </div>

                <div class="card-body">
                    <!-- Status + Order -->
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                        <span th:if="${s.isActive}"  class="badge-status green">● Active</span>
                        <span th:unless="${s.isActive}" class="badge-status gray">● Inactive</span>
                        <span style="font-size:12px; color:var(--text-muted);">Order: <strong th:text="${s.displayOrder}">0</strong></span>
                    </div>

                    <h3 style="font-size:15px; font-weight:600; margin-bottom:4px;" th:text="${s.title}">Banner Title</h3>
                    <p  style="font-size:13px; color:var(--text-muted); margin-bottom:10px;" th:text="${s.subtitle}">Subtitle</p>

                    <div th:if="${s.buttonText != null}" style="font-size:12px; color:var(--text-muted); margin-bottom:14px;">
                        Button: "<span th:text="${s.buttonText}"></span>"
                        → <span th:text="${s.buttonLink ?: '—'}"></span>
                    </div>

                    <div style="display:flex; gap:8px;">
                        <a th:href="@{/admin/slides/edit/{id}(id=${s.slideId})}" class="btn btn-outline btn-sm" style="flex:1; justify-content:center;">✏ Edit</a>
                        <form th:action="@{/admin/slides/delete/{id}(id=${s.slideId})}" method="post"
                              onsubmit="return confirm('Delete this banner?')">
                            <button type="submit" class="btn btn-danger btn-sm">🗑</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
