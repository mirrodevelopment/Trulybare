<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Access Denied</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet"/>
    <style>
        body { font-family:'Inter',sans-serif; background:#0d0d0d; color:#f0ebe4; display:flex; align-items:center; justify-content:center; min-height:100vh; margin:0; }
        .box { text-align:center; max-width:400px; padding:40px 24px; }
        .icon { font-size:56px; margin-bottom:20px; }
        h1   { font-size:24px; font-weight:700; margin-bottom:8px; }
        p    { color:#888; font-size:15px; margin-bottom:28px; }
        a    { display:inline-flex; align-items:center; gap:6px; padding:10px 20px; border-radius:8px; background:#86583d; color:#fff; font-weight:600; font-size:14px; text-decoration:none; }
        a:hover { opacity:0.85; }
    </style>
</head>
<body>
<div class="box">
    <div class="icon">🚫</div>
    <h1>Access Denied</h1>
    <p>You don't have permission to view this page. This area is restricted to administrators only.</p>
    <a th:href="@{/}">← Back to Store</a>
</div>
</body>
</html>
