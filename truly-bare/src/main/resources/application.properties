# ============================================
# TRULY BARE - Application Configuration
# ============================================

# Server Configuration
server.port=8080
server.servlet.context-path=/

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/trulybare
spring.datasource.username=siva
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Thymeleaf Configuration
spring.thymeleaf.cache=false

# File Upload & Post Size
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
server.tomcat.max-http-post-size=50MB

# Razorpay Configuration
razorpay.key.id=rzp_test_ShiuJCGFlhj0wa
razorpay.key.secret=6yg8DFD2y0K38PV3cV2KYluX
razorpay.currency=INR

# File Upload Directory (relative to working dir)
app.upload.dir=uploads

# Razorpay Webhook Secret (set this in Razorpay dashboard)
razorpay.webhook.secret=your_webhook_secret_here

# Google Cloud Storage
gcs.bucket-name=trulybare-storage-001
# File validation
app.upload.max-size-mb=10
app.upload.allowed-types=image/jpeg,image/png,image/webp,image/gif