<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Admin Login — Truly Bare</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"/>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --pale-white: #FAF8F5;
            --gold:       #C9A84C;
            --gold-light: #E0C97A;
            --garnet:     #8B1A1A;
            --garnet-2:   #B02525;
            --bark:       #5C3D2E;
            --text-dark:  #1C1C1A;
            --text-mid:   #4A4845;
            --text-muted: #888880;
            --border:     rgba(201,168,76,0.25);
        }

        html { height: 100%; }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
            background: linear-gradient(160deg, #F5EDE0 0%, #FAF8F5 40%, #F0EEE8 100%);
            -webkit-font-smoothing: antialiased;
            overflow: hidden;
        }

        /* Ambient blobs */
        .blob {
            position: fixed; border-radius: 50%;
            filter: blur(60px); pointer-events: none; z-index: 0;
        }
        .blob-1 {
            width: 400px; height: 400px;
            background: rgba(201,168,76,0.14);
            top: -100px; right: -80px;
            animation: floatBlob 14s ease-in-out infinite;
        }
        .blob-2 {
            width: 300px; height: 300px;
            background: rgba(139,26,26,0.09);
            bottom: -80px; left: -60px;
            animation: floatBlob 10s ease-in-out infinite -4s;
        }
        .blob-3 {
            width: 220px; height: 220px;
            background: rgba(92,61,46,0.07);
            top: 50%; left: 50%;
            transform: translate(-50%,-50%);
            animation: floatBlob 18s ease-in-out infinite -9s;
        }
        @keyframes floatBlob {
            0%,100% { transform: translate(0,0) scale(1); }
            50%      { transform: translate(-20px, 20px) scale(1.05); }
        }

        /* Card */
        .login-wrapper {
            position: relative; z-index: 1;
            width: 100%; max-width: 420px;
            animation: riseUp 0.9s cubic-bezier(0.22,1,0.36,1) both;
        }
        @keyframes riseUp {
            from { opacity: 0; transform: translateY(40px) scale(0.97); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        .login-card {
            background: rgba(255,255,255,0.78);
            backdrop-filter: blur(28px) saturate(160%);
            -webkit-backdrop-filter: blur(28px) saturate(160%);
            border: 1px solid var(--border);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 24px 72px rgba(92,61,46,0.14), inset 0 1px 0 rgba(255,255,255,0.8);
        }

        /* Brand Header */
        .brand-header {
            text-align: center;
            padding: 40px 40px 26px;
            background: linear-gradient(180deg, rgba(201,168,76,0.06) 0%, transparent 100%);
            border-bottom: 1px solid rgba(201,168,76,0.15);
        }
        .brand-emblem {
            width: 60px; height: 60px;
            margin: 0 auto 18px;
            background: linear-gradient(135deg, var(--garnet), var(--bark));
            border-radius: 14px;
            display: flex; align-items: center; justify-content: center;
            font-size: 26px;
            box-shadow: 0 8px 24px rgba(139,26,26,0.22);
        }
        .brand-name {
            font-family: 'Cormorant Garamond', serif;
            font-size: 26px; font-weight: 500;
            letter-spacing: 6px; text-transform: uppercase;
            background: linear-gradient(135deg, var(--text-dark) 0%, var(--gold) 55%, var(--text-dark) 100%);
            background-size: 200% auto;
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
            animation: goldShimmer 5s linear infinite;
            display: block; margin-bottom: 6px;
        }
        @keyframes goldShimmer {
            0%   { background-position: 0% center; }
            100% { background-position: 200% center; }
        }
        .brand-sub {
            font-size: 10px; color: var(--text-muted);
            letter-spacing: 2.5px; text-transform: uppercase; font-weight: 400;
        }

        /* Form body */
        .form-body { padding: 30px 36px 36px; }

        .page-label {
            font-size: 12px; font-weight: 600; color: var(--text-muted);
            text-transform: uppercase; letter-spacing: 2px; text-align: center;
            margin-bottom: 26px;
        }

        /* Error */
        .alert-error {
            background: rgba(139,26,26,0.07);
            border: 1px solid rgba(139,26,26,0.22);
            color: var(--garnet);
            padding: 12px 16px;
            border-radius: 8px; font-size: 13px; font-weight: 500;
            margin-bottom: 22px;
            display: flex; align-items: center; gap: 8px;
        }

        /* Input groups */
        .form-group { margin-bottom: 20px; }
        .form-group label {
            display: block; font-size: 10px; font-weight: 600;
            color: var(--text-mid); text-transform: uppercase; letter-spacing: 1.5px;
            margin-bottom: 8px;
        }
        .input-wrap { position: relative; }
        .input-wrap i {
            position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
            color: var(--text-muted); font-size: 15px; pointer-events: none;
            transition: color 0.2s;
        }
        .input-wrap:focus-within i { color: var(--gold); }
        .input-wrap input {
            width: 100%;
            background: rgba(255,255,255,0.65);
            border: 1px solid rgba(201,168,76,0.25);
            border-radius: 10px;
            color: var(--text-dark);
            font-family: 'Inter', sans-serif;
            font-size: 14px; font-weight: 400;
            padding: 13px 16px 13px 44px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .input-wrap input:focus {
            border-color: var(--gold);
            box-shadow: 0 0 0 3px rgba(201,168,76,0.12);
        }
        .input-wrap input::placeholder { color: rgba(120,115,110,0.5); }

        /* Submit */
        .btn-login {
            width: 100%;
            background: linear-gradient(135deg, var(--garnet), var(--garnet-2));
            color: #fff;
            font-family: 'Inter', sans-serif;
            font-size: 11px; font-weight: 600;
            letter-spacing: 2.5px; text-transform: uppercase;
            padding: 16px;
            border: none; border-radius: 50px;
            cursor: pointer; margin-top: 8px;
            transition: all 0.25s ease;
            display: flex; align-items: center; justify-content: center; gap: 10px;
            box-shadow: 0 6px 20px rgba(139,26,26,0.22);
            position: relative; overflow: hidden;
        }
        .btn-login::before {
            content: '';
            position: absolute; inset: 0;
            background: linear-gradient(90deg, transparent, rgba(201,168,76,0.25), transparent);
            transform: translateX(-100%); transition: transform 0.6s ease;
        }
        .btn-login:hover { opacity: 0.9; transform: translateY(-1px); box-shadow: 0 8px 24px rgba(139,26,26,0.28); }
        .btn-login:hover::before { transform: translateX(100%); }
        .btn-login:active { transform: scale(0.98); }

        .gold-rule { border: none; height: 1px; background: linear-gradient(90deg, transparent, var(--gold), transparent); margin: 22px 0; }

        .footer-note {
            text-align: center; color: var(--text-muted);
            font-size: 11px; letter-spacing: 0.5px;
        }
        .footer-note i { margin-right: 5px; }
    </style>
</head>
<body>
<div class="blob blob-1"></div>
<div class="blob blob-2"></div>
<div class="blob blob-3"></div>

<div class="login-wrapper">
    <div class="login-card">
        <div class="brand-header">
            <div class="brand-emblem">🌿</div>
            <span class="brand-name">Truly Bare</span>
            <span class="brand-sub">Private Management Console</span>
        </div>

        <div class="form-body">
            <div class="page-label">Secure Admin Access</div>

            <div class="alert-error" th:if="${error}">
                <i class="bi bi-exclamation-circle"></i>
                <span th:text="${error}">Invalid credentials.</span>
            </div>

            <form th:action="@{/secure-admin-login-process}" method="post">
                <div class="form-group">
                    <label for="username">Admin Username</label>
                    <div class="input-wrap">
                        <i class="bi bi-person-lock"></i>
                        <input type="text" id="username" name="username"
                               placeholder="Trulybare@admin" required autofocus/>
                    </div>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-wrap">
                        <i class="bi bi-key"></i>
                        <input type="password" id="password" name="password"
                               placeholder="••••••••••" required/>
                    </div>
                </div>

                <button type="submit" class="btn-login">
                    <i class="bi bi-shield-check"></i> Sign In to Admin Panel
                </button>
            </form>

            <hr class="gold-rule">
            <p class="footer-note">
                <i class="bi bi-lock"></i>This page is private. Do not share this URL.
            </p>
        </div>
    </div>
</div>
</body>
</html>
