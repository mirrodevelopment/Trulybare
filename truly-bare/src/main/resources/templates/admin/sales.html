<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/layout :: head('Sales Report')}"></head>
<body>

<div th:replace="~{admin/layout :: sidebar('sales')}"></div>

<div class="main-content">
    <div class="topbar">
        <span class="page-title">📈 Sales Report</span>
    </div>

    <div class="content-area">

        <!-- Advanced Filter Header -->
        <div class="card" style="margin-bottom:24px;">
            <div class="card-body" style="padding:20px 24px;">
                <h3 style="font-size:16px; font-weight:500; color:var(--text-muted); margin-bottom:16px;">Revenue Summary</h3>
                
                <form th:action="@{/admin/sales}" method="get" id="salesFilterForm"
                      style="display:flex; align-items:center; gap:12px; flex-wrap:wrap;">
                    
                    <!-- KPI inside filter bar -->
                    <div style="display:flex; align-items:center; gap:16px; margin-right:auto;">
                        <div style="background:var(--bg-success); color:var(--green); width:40px; height:40px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:20px;">📈</div>
                        <div style="font-size:24px; font-weight:700; color:var(--text-dark);">
                            ₹<span th:text="${salesData.totalRevenue != null ? #numbers.formatDecimal(salesData.totalRevenue, 0, 'COMMA', 0, 'POINT') : '0'}">0</span>
                        </div>
                    </div>

                    <!-- Dropdown -->
                    <select name="type" id="filterType" onchange="toggleDateInputs()"
                            style="background:#fff; border:1px solid var(--border); border-radius:8px; padding:10px 14px; font-size:14px; color:var(--text-dark); outline:none; min-width:180px;">
                        <option value="OVERALL"   th:selected="${activeType == 'OVERALL'}">Overall Revenue</option>
                        <option value="TODAY"     th:selected="${activeType == 'TODAY'}">Today's Revenue</option>
                        <option value="YESTERDAY" th:selected="${activeType == 'YESTERDAY'}">Yesterday's Revenue</option>
                        <option value="SELECTIVE" th:selected="${activeType == 'SELECTIVE'}">Selective Date</option>
                        <option value="CUSTOM"    th:selected="${activeType == 'CUSTOM'}">Custom Date Range</option>
                    </select>

                    <!-- Date Inputs -->
                    <div id="dateRangeContainer" style="display:flex; align-items:center; gap:8px;">
                        <input type="date" name="startDate" id="startDate" th:value="${startDate}"
                               style="background:#fff; border:1px solid var(--border); border-radius:8px; padding:9px 12px; font-size:13px; color:var(--text-dark); outline:none;"/>
                        
                        <span id="toLabel" style="color:var(--text-muted); font-size:14px;">to</span>
                        
                        <input type="date" name="endDate" id="endDate" th:value="${endDate}"
                               style="background:#fff; border:1px solid var(--border); border-radius:8px; padding:9px 12px; font-size:13px; color:var(--text-dark); outline:none;"/>
                    </div>

                    <button type="submit" class="btn btn-primary" style="background:#4a6759; border:none; padding:11px 20px;">Apply Filter</button>
                    <a th:href="@{/admin/sales(type='TODAY')}" style="font-size:13px; color:var(--text-muted); text-decoration:none; margin-left:8px;">✕ Clear</a>
                </form>
            </div>
        </div>

        <!-- KPI Summary Cards -->
        <div class="stats-grid" style="margin-bottom:24px;">
            <div class="stat-card">
                <div class="stat-icon" style="color:var(--green);">🛒</div>
                <div class="stat-value" th:text="${salesData.totalOrders}">0</div>
                <div class="stat-label">Orders in Period</div>
            </div>
            <div class="stat-card accent">
                <div class="stat-icon">🗓</div>
                <div class="stat-value" style="font-size:14px; font-weight:600;">
                    <span th:text="${salesData.start}"></span> 
                    <span th:if="${salesData.start != salesData.end}">
                        → <span th:text="${salesData.end}"></span>
                    </span>
                </div>
                <div class="stat-label">Report Timeline</div>
            </div>
        </div>

        <!-- Product Table -->
        <div class="card">
            <div class="card-header">
                <h2>Performance Breakdown</h2>
            </div>

            <div th:if="${salesData.productSales == null or #lists.isEmpty(salesData.productSales)}"
                 style="padding:80px 20px; text-align:center; color:var(--text-muted);">
                <div style="font-size:48px; margin-bottom:16px;">📊</div>
                <p style="font-size:16px; font-weight:500;">No sales data for this period.</p>
            </div>

            <div th:if="${salesData.productSales != null and !#lists.isEmpty(salesData.productSales)}" style="overflow-x:auto;">
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Product Name</th>
                            <th>Units Sold</th>
                            <th>Revenue Generated</th>
                            <th>Market Share</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="row, stat : ${salesData.productSales}">
                            <td class="muted" th:text="${stat.index + 1}">1</td>
                            <td style="font-weight:600;" th:text="${row.name}">Product</td>
                            <td>
                                <span class="badge-status blue" th:text="${row.units} + ' sold'">0 sold</span>
                            </td>
                            <td style="font-weight:700; color:var(--garnet);">
                                ₹<span th:text="${row.revenue != null ? #numbers.formatDecimal(row.revenue, 0, 'COMMA', 2, 'POINT') : '0.00'}">0.00</span>
                            </td>
                            <td>
                                <div style="display:flex; align-items:center; gap:10px;">
                                    <div style="flex:1; height:8px; background:rgba(0,0,0,0.04); border-radius:10px; overflow:hidden;">
                                        <div style="background:var(--green); height:100%;"
                                             th:style="'background:var(--green); height:100%; width:' + ${row.pct} + '%'"></div>
                                    </div>
                                    <span style="font-size:12px; font-weight:600; color:var(--text-muted);" th:text="${row.pct} + '%'">0%</span>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    function toggleDateInputs() {
        const typeSelect = document.getElementById('filterType');
        if (!typeSelect) return;
        
        const type = typeSelect.value;
        const container = document.getElementById('dateRangeContainer');
        const endInput = document.getElementById('endDate');
        const toLabel = document.getElementById('toLabel');

        if (type === 'OVERALL' || type === 'TODAY' || type === 'YESTERDAY') {
            if (container) container.style.display = 'none';
        } else if (type === 'SELECTIVE') {
            if (container) container.style.display = 'flex';
            if (endInput) endInput.style.display = 'none';
            if (toLabel) toLabel.style.display = 'none';
        } else if (type === 'CUSTOM') {
            if (container) container.style.display = 'flex';
            if (endInput) endInput.style.display = 'block';
            if (toLabel) toLabel.style.display = 'inline';
        }
    }

    document.addEventListener('DOMContentLoaded', function() {
        toggleDateInputs();
        const ft = document.getElementById('filterType');
        if (ft) ft.addEventListener('change', toggleDateInputs);
    });
</script>

</body>
</html>
