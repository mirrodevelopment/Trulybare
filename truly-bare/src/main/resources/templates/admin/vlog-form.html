<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/layout :: head(${pageTitle})}"></head>
<body>

<div th:replace="~{admin/layout :: sidebar('vlogs')}"></div>

<div class="main-content">
    <div class="topbar">
        <span class="page-title"><i class="bi bi-camera-video"></i> Vlog Management</span>
    </div>

    <div class="page-header" style="margin-bottom: 24px;">
        <a th:href="@{/admin/vlogs}" style="text-decoration: none; color: var(--text-muted); font-size: 13px; display: inline-flex; align-items: center; gap: 4px; margin-bottom: 12px;">
            <i class="bi bi-arrow-left"></i> Back to Vlogs
        </a>
        <h1 class="page-title" th:text="${pageTitle}">Vlog Form</h1>
    </div>

    <div class="card" style="max-width: 800px;">
        <div class="card-header">
            <h2><i class="bi bi-camera-reels"></i> Vlog Information</h2>
        </div>
        <div class="card-body">
            <form th:action="@{/admin/vlogs/save}" method="post" th:object="${vlog}" enctype="multipart/form-data">
                <input type="hidden" th:field="*{vlogId}">
                <input type="hidden" th:field="*{posterUrl}">
                <input type="hidden" th:field="*{createdAt}">

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px;">
                    <div class="form-group">
                        <label>Vlog Title <span style="color: var(--garnet);">*</span></label>
                        <input type="text" th:field="*{title}" placeholder="e.g., Inside Our Delhi Flagship" required>
                    </div>
                    <div class="form-group">
                        <label>Tag / Label <span style="color: var(--garnet);">*</span></label>
                        <input type="text" th:field="*{tag}" placeholder="e.g., Store Tour" required>
                    </div>
                </div>

                <div class="form-group" style="margin-bottom: 20px;">
                    <label>Description <span style="color: var(--garnet);">*</span></label>
                    <textarea th:field="*{description}" rows="3" placeholder="A brief description of the video content..." required></textarea>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px;">
                    <div class="form-group">
                        <label>Location</label>
                        <input type="text" th:field="*{location}" placeholder="e.g., Delhi">
                    </div>
                    <div class="form-group">
                        <label>Display Date</label>
                        <input type="text" th:field="*{vlogDate}" placeholder="e.g., April 2024">
                    </div>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 24px;">
                    <div class="form-group" style="display: flex; flex-direction: column; gap: 12px;">
                        <div>
                            <label>External Video URL (e.g. YouTube Link)</label>
                            <input type="text" th:field="*{videoUrl}" placeholder="https://www.youtube.com/watch?v=...">
                        </div>
                        <div style="text-align: center; color: var(--text-muted); font-size: 12px; font-weight: 500;">
                            — OR —
                        </div>
                        <div>
                            <label>Upload Video File (MP4)</label>
                            <input type="file" name="videoFile" accept="video/mp4">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Poster / Thumbnail (Image)</label>
                        <input type="file" name="posterFile" accept="image/*">
                        <div th:if="*{posterUrl != null}" style="margin-top: 10px;">
                            <img th:src="*{posterUrl}" style="height: 60px; border-radius: 4px; border: 1px solid var(--border);">
                        </div>
                    </div>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px;">
                    <div class="form-group">
                        <label>Display Order</label>
                        <input type="number" th:field="*{displayOrder}" min="0">
                    </div>
                    <div class="form-group" style="display: flex; align-items: center; gap: 10px; padding-top: 30px;">
                        <input type="checkbox" th:field="*{isActive}" style="width: 20px; height: 20px; cursor: pointer;">
                        <label th:for="${#ids.prev('isActive')}" style="margin-bottom: 0; cursor: pointer;">Active & Visible on Homepage</label>
                    </div>
                </div>

                <div style="display: flex; gap: 12px; border-top: 1px solid var(--border); padding-top: 24px;">
                    <button type="submit" class="btn-primary">
                        <i class="bi bi-check-lg"></i> Save Vlog
                    </button>
                    <a th:href="@{/admin/vlogs}" class="btn-secondary" style="text-decoration: none;">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>

</body>
</html>
