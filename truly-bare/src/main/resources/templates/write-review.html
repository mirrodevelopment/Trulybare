<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Truly Bare | Share Your Experience</title>
    <link rel="icon" type="image/png" th:href="@{/assets/images/logo.png}" href="/assets/images/logo.png">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Inter:wght@300;400;500;600&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/write-review.css}">
</head>

<body>

    <div class="success-overlay" id="successOverlay">
        <div class="success-icon">
            <i class="bi bi-patch-check"></i>
        </div>
        <div class="success-msg">
            <h2>Thank You</h2>
            <p>Your reflection has been received. Formulations are balanced — as is your feedback.</p>
            <p style="font-size: 13px; margin-top: 20px; opacity: 0.6;">Redirecting to home...</p>
        </div>
    </div>

    <header class="brand-header">
        <a th:href="@{/home}" class="brand-logo">
            <span class="initial">T</span>RULY <span class="initial">B</span>ARE
        </a>
    </header>

    <main class="review-wrapper">
        <div class="review-card">
            <div class="review-title">
                <h1>Share your experience</h1>
                <p>Formulations of note deserve a reflection.</p>
            </div>

            <div class="product-meta">
                <img th:src="@{${product.imageUrl != null ? product.imageUrl : '/assets/images/placeholder.png'}}"
                    alt="Product" class="product-img" onerror="this.onerror=null; this.src='/assets/images/placeholder.png';">
                <div class="product-info">
                    <h3 th:text="${product.name}">Product Name</h3>
                    <span th:text="${product.category?.name}">Category</span>
                </div>
            </div>

            <form class="review-form" th:action="@{/review/submit}" method="post">
                <input type="hidden" name="productId" th:value="${product.productId}">
                <input type="hidden" name="orderId" th:value="${orderId}">

                <div class="rating-section">
                    <span class="rating-label">Overall Rating</span>
                    <div class="star-rating">
                        <input type="radio" id="star5" name="rating" value="5" required />
                        <label for="star5" title="5 stars"><i class="bi bi-star-fill"></i></label>
                        <input type="radio" id="star4" name="rating" value="4" />
                        <label for="star4" title="4 stars"><i class="bi bi-star-fill"></i></label>
                        <input type="radio" id="star3" name="rating" value="3" />
                        <label for="star3" title="3 stars"><i class="bi bi-star-fill"></i></label>
                        <input type="radio" id="star2" name="rating" value="2" />
                        <label for="star2" title="2 stars"><i class="bi bi-star-fill"></i></label>
                        <input type="radio" id="star1" name="rating" value="1" />
                        <label for="star1" title="1 star"><i class="bi bi-star-fill"></i></label>
                    </div>
                </div>

                <div class="input-group">
                    <label for="comment">Your Reflection</label>
                    <textarea id="comment" name="comment" class="modern-textarea"
                        placeholder="How did this formulation make you feel?" required></textarea>
                </div>

                <div class="user-info">
                    <div class="user-detail">
                        <span>Reviewer</span>
                        <strong th:text="${user.fullName}">Guest Name</strong>
                    </div>
                    <div class="user-detail" style="text-align: right;">
                        <span>Date</span>
                        <strong th:text="${#temporals.format(#temporals.createNow(), 'dd MMM yyyy')}">Date</strong>
                    </div>
                </div>

                <button type="submit" class="btn-submit">Submit Reflection</button>
            </form>

            <a th:href="@{/home}" class="btn-back">
                <i class="bi bi-arrow-left"></i> Back
            </a>
        </div>
    </main>

    <script>
        document.querySelector('.review-form').addEventListener('submit', function (e) {
            e.preventDefault();

            const form = this;
            const formData = new FormData(form);

            // Change button state
            const btn = form.querySelector('.btn-submit');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="bi bi-hourglass-split"></i> Submitting...';
            btn.disabled = true;

            fetch(form.action, {
                method: 'POST',
                body: formData
            })
            .then(response => {
                // Show success overlay even if it redirects server-side, 
                // because fetch follows redirects and returns the final page.
                // We just want to show the overlay and wait.
                document.getElementById('successOverlay').classList.add('active');
                
                // Redirect after 3 seconds
                setTimeout(() => {
                    window.location.href = '/home';
                }, 3000);
            })
            .catch(error => {
                console.error('Error:', error);
                alert('An error occurred while submitting your review.');
                btn.innerHTML = originalText;
                btn.disabled = false;
            });
        });
    </script>
</body>

</html>
